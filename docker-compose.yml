volumes:
  kong_db_data: {}

networks:
  kong-net:
    driver: bridge

x-kong-config: &kong-env
  KONG_DATABASE: postgres
  KONG_PG_HOST: kong-database
  KONG_PG_DATABASE: kong
  # Default credentials for local dev; change for production
  KONG_PG_USER: kong
  KONG_PG_PASSWORD: kong

services:
  kong-database:
    container_name: kong-database
    image: postgres:15-alpine
    restart: on-failure
    volumes:
      - kong_db_data:/var/lib/postgresql/data
    networks:
      - kong-net
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 5s
      timeout: 10s
      retries: 10

  kong-bootstrap:
    image: kong:latest
    container_name: kong-bootstrap
    networks:
      - kong-net
    depends_on:
      kong-database:
        condition: service_healthy
    restart: on-failure
    environment:
      <<: *kong-env
    command: kong migrations bootstrap

  kong-gateway:
    image: kong:latest
    container_name: kong-gateway
    restart: on-failure
    networks:
      - kong-net
    environment:
      <<: *kong-env
      # Enable the Admin API and the basic Kong Manager OSS
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002, 0.0.0.0:8445 ssl
    depends_on:
      kong-bootstrap:
        condition: service_completed_successfully
    ports:
      - "8000:8000"  # Proxy
      - "8443:8443"  # Proxy SSL
      - "8001:8001"  # Admin API
      - "8002:8002"  # Kong Manager GUI

  my-nginx:
    image: nginx:alpine
    container_name: my-nginx
    networks:
      - kong-net

  weather-api:
    build:
      context: ./weatherAPI
      dockerfile: Dockerfile
    container_name: weather-api
    restart: on-failure
    networks:
      - kong-net
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    restart: on-failure
    depends_on:
      - weather-api
    networks:
      - kong-net
    ports:
      - "8080:8080"
    environment:
      WEATHER_API_BASE_URL: http://weather-api:5000/weather
      MCP_PORT: 8080
