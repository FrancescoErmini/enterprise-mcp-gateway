volumes:
  kong_db_data: {}
  keycloak_data: {}

networks:
  kong-net:
    driver: bridge

x-kong-config: &kong-env
  KONG_DATABASE: postgres
  KONG_PG_HOST: kong-database
  KONG_PG_DATABASE: kong
  # Default credentials for local dev; change for production
  KONG_PG_USER: kong
  KONG_PG_PASSWORD: kong

services:
  kong-database:
    container_name: kong-database
    image: postgres:15-alpine
    restart: on-failure
    volumes:
      - kong_db_data:/var/lib/postgresql/data
    networks:
      - kong-net
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 5s
      timeout: 10s
      retries: 10

  kong-bootstrap:
    image: kong:latest
    container_name: kong-bootstrap
    networks:
      - kong-net
    depends_on:
      kong-database:
        condition: service_healthy
    restart: on-failure
    environment:
      <<: *kong-env
    command: kong migrations bootstrap

  kong-gateway:
    image: kong:latest
    container_name: kong-gateway
    restart: on-failure
    networks:
      - kong-net
    environment:
      <<: *kong-env
      # Enable the Admin API and the basic Kong Manager OSS
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002, 0.0.0.0:8445 ssl
    depends_on:
      kong-bootstrap:
        condition: service_completed_successfully
    ports:
      - "8000:8000"  # Proxy
      - "8443:8443"  # Proxy SSL
      - "8001:8001"  # Admin API
      - "8002:8002"  # Kong Manager GUI

  my-nginx:
    image: nginx:alpine
    container_name: my-nginx
    networks:
      - kong-net

  weather-api:
    build:
      context: ./weatherAPI
      dockerfile: Dockerfile
    container_name: weather-api
    restart: on-failure
    networks:
      - kong-net
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    restart: on-failure
    networks:
      - kong-net
    ports:
      - "8080:8080"
    environment:
      MCP_PORT: 8080
      MG_API_BASE_URL: https://kresource-dev.menarini.net
      MG_TOKEN_URL: https://keycloak-dev.menarini.net/auth/realms/menarini/protocol/openid-connect/token
      MG_CLIENT_ID: mg-app_resourceAdministration
      MG_CLIENT_SECRET: ${MG_CLIENT_SECRET}
      MG_USERNAME: kscanner_service_account
      MG_PASSWORD: ${MG_PASSWORD}
      MG_VERIFY_SSL: "false"
      MG_APPLICATION_IDS: ${MG_APPLICATION_IDS:-}
      MG_APPLICATION_CODES: ${MG_APPLICATION_CODES:-}

  opa:
    image: openpolicyagent/opa:1.4.1
    container_name: opa
    command: >
      run --server --addr=0.0.0.0:8181 --watch /policies
    volumes:
      - ./opa/policies:/policies
    ports:
      - "0.0.0.0:8181:8181"
    networks:
      - kong-net

  opa-guard:
    build:
      context: ./opa-guard
      dockerfile: Dockerfile
    container_name: opa-guard
    restart: on-failure
    depends_on:
      - keycloak
      - mcp-server
      - opa
    networks:
      - kong-net
    ports:
      - "8090:8090"
    environment:
      KEYCLOAK_INTROSPECT_URL: http://keycloak:8080/realms/mcp/protocol/openid-connect/token/introspect
      KEYCLOAK_CLIENT_ID: mcp
      KEYCLOAK_CLIENT_SECRET: uOxcgeKNfuWs7QK4D8qTqsQ8JzsLJe22
      KEYCLOAK_INTROSPECT_HOST_HEADER: localhost:8081
      OPA_URL: http://opa:8181/v1/data/mcp/allow
      MCP_SERVER_URL: http://mcp-server:8080/mcp

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    container_name: keycloak
    command:
      - start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_FRONTEND_URL: http://localhost:8081/auth
    ports:
      - "8081:8080"
    networks:
      - kong-net
    volumes:
      - keycloak_data:/opt/keycloak/data
