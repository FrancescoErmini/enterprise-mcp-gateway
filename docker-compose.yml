networks:
  mcp-net:

volumes:
  pg_data:

x-guard-env: &guard-env
  KEYCLOAK_INTROSPECT_URL: http://keycloak:8080/realms/mcp-demo/protocol/openid-connect/token/introspect
  KEYCLOAK_CLIENT_ID: mcp-gateway
  KEYCLOAK_CLIENT_SECRET: mcp-secret-123
  OPA_URL: http://opa:8181/v1/data/mcp/authz

x-api-env: &api-env
  JWT_ISSUER: http://localhost:8080/realms/mcp-demo
  JWKS_URL: http://keycloak:8080/realms/mcp-demo/protocol/openid-connect/certs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes: [pg_data:/var/lib/postgresql/data]
    networks: [mcp-net]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: start-dev --import-realm --features=token-exchange
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_LOG_LEVEL: "INFO,org.keycloak.events:debug"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports: ["8080:8080"]
    networks: [mcp-net]
    depends_on:
      postgres: {condition: service_healthy}

  opa:
    image: openpolicyagent/opa:1.4.1
    command: run --server --addr=0.0.0.0:8181 --watch --set=decision_logs.console=true /policies
    volumes: [./opa/policies:/policies:ro]
    ports: ["8181:8181"]
    networks: [mcp-net]

  crm-api:
    build: ./crm-api
    environment: *api-env
    ports: ["8001:8000"]
    networks: [mcp-net]

  orders-api:
    build: ./orders-api
    environment: *api-env
    ports: ["8002:8000"]
    networks: [mcp-net]

  crm-mcp:
    build: ./crm-mcp
    environment:
      CRM_API_URL: http://crm-api:8000
    networks: [mcp-net]
    depends_on: [crm-api]

  orders-mcp:
    build: ./orders-mcp
    environment:
      ORDERS_API_URL: http://orders-api:8000
    networks: [mcp-net]
    depends_on: [orders-api]

  crm-guard:
    build: ./opa-guard
    environment:
      <<: *guard-env
      DOMAIN: crm
      UPSTREAM_URL: http://crm-mcp:8000/mcp
    networks: [mcp-net]
    depends_on: [crm-mcp, opa, keycloak]

  orders-guard:
    build: ./opa-guard
    environment:
      <<: *guard-env
      DOMAIN: orders
      UPSTREAM_URL: http://orders-mcp:8000/mcp
    networks: [mcp-net]
    depends_on: [orders-mcp, opa, keycloak]

  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes: [./kong/kong.yml:/kong/kong.yml:ro]
    ports: ["8000:8000"]
    networks: [mcp-net]
    depends_on: [crm-guard, orders-guard]

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    networks: [mcp-net]

  chat:
    build: ./chat
    env_file:
      - path: .env
        required: false
    environment:
      KONG_URL: http://kong:8000
    ports: ["3001:8000"]
    networks: [mcp-net]
    depends_on: [kong]
