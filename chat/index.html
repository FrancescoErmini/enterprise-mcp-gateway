<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>MCP Chat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 1.5rem auto; padding: 0 1rem; }
  header { display: flex; justify-content: space-between; align-items: center; }
  #log { border: 1px solid #ccc; border-radius: 8px; height: 55vh; overflow-y: auto; padding: .75rem; margin: 1rem 0; }
  .msg { margin: .5rem 0; padding: .5rem .75rem; border-radius: 8px; white-space: pre-wrap; }
  .user { background: #e3f0ff; margin-left: 20%; }
  .bot { background: #f2f2f2; margin-right: 20%; }
  details { margin: .25rem 0; font-size: .85rem; background: #fff8e1; border-radius: 6px; padding: .25rem .5rem; }
  details.denied { background: #ffe5e5; }
  form { display: flex; gap: .5rem; }
  input { flex: 1; padding: .6rem; }
  button { padding: .5rem 1rem; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>MCP Chat</h1>
  <div><span id="who">Non autenticato</span> <button id="login">Login</button><button id="logout" hidden>Logout</button></div>
</header>
<div id="log"></div>
<form id="form">
  <input id="input" placeholder="Es. Elenca i clienti, mostrami gli ordini..." autocomplete="off" disabled>
  <button id="send" disabled>Invia</button>
</form>
<script>
const KC = "http://localhost:8080/realms/mcp-demo/protocol/openid-connect";
const CLIENT_ID = "frontend-web";
const REDIRECT = location.origin + "/";
const $ = id => document.getElementById(id);
const history_ = [];

const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const rand = () => b64url(crypto.getRandomValues(new Uint8Array(32)));

async function login() {
  const verifier = rand();
  sessionStorage.setItem("verifier", verifier);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  location = `${KC}/auth?` + new URLSearchParams({
    client_id: CLIENT_ID, redirect_uri: REDIRECT, response_type: "code", scope: "openid",
    code_challenge: challenge, code_challenge_method: "S256",
  });
}

async function handleCallback() {
  const code = new URLSearchParams(location.search).get("code");
  if (!code) return;
  const resp = await fetch(`${KC}/token`, {
    method: "POST",
    body: new URLSearchParams({
      grant_type: "authorization_code", client_id: CLIENT_ID, code,
      redirect_uri: REDIRECT, code_verifier: sessionStorage.getItem("verifier"),
    }),
  });
  const data = await resp.json();
  if (data.access_token) sessionStorage.setItem("token", data.access_token);
  history.replaceState({}, "", REDIRECT);
}

function claims() {
  const t = sessionStorage.getItem("token");
  if (!t) return null;
  const c = JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
  return c.exp * 1000 > Date.now() ? c : null;
}

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}

function addTool(t) {
  const d = document.createElement("details");
  if (t.result.startsWith("ACCESS DENIED")) d.className = "denied";
  const s = document.createElement("summary");
  s.textContent = `Tool MCP: ${t.tool}(${JSON.stringify(t.arguments)})`;
  const p = document.createElement("pre");
  p.textContent = t.result;
  d.append(s, p);
  $("log").appendChild(d);
}

function render() {
  const c = claims();
  $("who").textContent = c ? `${c.preferred_username} [${(c.realm_access?.roles || []).join(", ")}]` : "Non autenticato";
  $("login").hidden = !!c;
  $("logout").hidden = !c;
  $("input").disabled = $("send").disabled = !c;
}

$("login").onclick = login;
$("logout").onclick = () => { sessionStorage.removeItem("token"); render(); };
$("form").onsubmit = async e => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  add("user", text);
  history_.push({ role: "user", content: text });
  $("send").disabled = true;
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionStorage.getItem("token") },
      body: JSON.stringify({ messages: history_ }),
    });
    const data = await r.json();
    if (!r.ok) { add("bot", "Errore: " + (data.detail || r.status)); return; }
    data.tool_calls.forEach(addTool);
    add("bot", data.reply);
    history_.push({ role: "assistant", content: data.reply });
  } catch (err) {
    add("bot", "Errore: " + err);
  } finally {
    $("send").disabled = !claims();
  }
};
handleCallback().then(render);
</script>
</body>
</html>
