_format_version: "3.0"
services:
  - name: weather-api
    url: http://weather-api:5000
    routes:
      - name: weather-route
        paths:
          - /weather
        strip_path: false
        plugins:
          - name: request-transformer
            enabled: true
            config:
              add:
                headers:
                  - X-API-Key:${{ env "DECK_WEATHERAPI_LOCAL_KEY" }}
  - name: mcp-server
    url: http://mcp-server:8080
    routes:
      - name: mcp-route
        paths:
          - /mcp
        strip_path: false
